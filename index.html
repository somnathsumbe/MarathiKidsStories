<!DOCTYPE html>
<html lang="mr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d95d39" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="मराठी गोष्टी" />
    <meta name="description" content="गोष्टींचं सुंदर जग - मराठी मुलांसाठी गोष्टी, बोध आणि वाचन आनंद." />
    <title>मराठी कथा संग्रह</title>

    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <style>
      :root { --ink:#24313a; --muted:#68757a; --paper:#fffaf0; --surface:#fff; --line:#eadfce; --saffron:#d95d39; --teal:#147d78; --gold:#f2b84b; --shadow:0 18px 40px rgba(101,65,37,.10); }
      :root[data-theme="light"] { --paper:#f7f9f8; --surface:#fff; --line:#dfe8e5; --ink:#203238; }
      :root[data-theme="dark"] { --paper:#182325; --surface:#213033; --line:#3a4b4e; --ink:#f5efe3; --muted:#b8c6c4; --shadow:0 18px 40px rgba(0,0,0,.22); }
      * { box-sizing:border-box; }
      html, body { margin:0; min-height:100%; overflow-x:hidden; background:var(--paper); color:var(--ink); font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      body { min-height:100dvh; padding:calc(64px + env(safe-area-inset-top)) 0 calc(88px + env(safe-area-inset-bottom)); }
      button, input { font:inherit; }
      button { cursor:pointer; }
      .page-shell, .reader-content { width:min(520px, calc(100% - 24px)); margin:auto; }
      .page-shell { padding:24px 0 40px; }
      .app-header { position:fixed; z-index:60; top:0; left:0; right:0; min-height:64px; padding:env(safe-area-inset-top) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left)); display:flex; align-items:center; background:var(--surface); border-bottom:1px solid var(--line); backdrop-filter:blur(14px); }
      @supports (background:color-mix(in srgb, white, black)) { .app-header { background:color-mix(in srgb, var(--surface) 94%, transparent); } }
      .app-header-inner { width:min(520px, 100%); min-height:64px; margin:auto; display:flex; align-items:center; justify-content:space-between; gap:8px; }
      .app-header-title { display:flex; align-items:center; gap:8px; font-weight:800; color:var(--ink); }
      .app-header-title small { display:block; color:var(--muted); font-size:.7rem; font-weight:500; }
      .header-action { min-width:44px; min-height:44px; border:0; border-radius:14px; color:var(--ink); background:transparent; font-size:1.25rem; }
      .eyebrow, .section-kicker { color:var(--saffron); font-size:.84rem; font-weight:700; letter-spacing:.03em; }
      h1, h2, p { margin-top:0; }
      h1, h2 { font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height:1.12; }
      .button { border:0; border-radius:14px; min-height:48px; padding:10px 18px; font-weight:700; transition:transform .18s, box-shadow .18s; }
      .button:hover { transform:translateY(-2px); box-shadow:0 8px 18px rgba(0,0,0,.12); }
      .button-primary { background:var(--saffron); color:#fff; }
      .button-secondary { background:#e3f2ed; color:#176d68; }
      .button-light { background:#fff4d7; color:#9c452d; }
      .button-outline { background:transparent; color:var(--ink); border:1px solid var(--line); }
      .hero { min-height:360px; padding:32px 24px; border-radius:26px; color:#fff; display:flex; align-items:center; justify-content:space-between; overflow:hidden; background:radial-gradient(circle at 85% 15%, rgba(242,184,75,.55), transparent 30%), linear-gradient(125deg,#b74732 0%,#d95d39 50%,#147d78 130%); box-shadow:var(--shadow); }
      .hero h1 { margin:12px 0 16px; font-size:clamp(2.2rem, 6vw, 3.6rem); }
      .hero h1 em { color:#ffe2a3; font-style:normal; }
      .hero-copy > p { font-size:1.2rem; margin-bottom:25px; }
      .hero-stats { display:flex; flex-wrap:wrap; gap:13px; margin-bottom:28px; color:#ffe8ca; font-size:.9rem; }
      .hero-stats span { border-right:1px solid rgba(255,255,255,.3); padding-right:13px; }
      .hero-stats span:last-child { border:0; }
      .hero-stats strong { color:#fff; font-size:1.05rem; }
      .hero-emblem { font-size:clamp(7rem, 19vw, 13rem); transform:rotate(-8deg); filter:drop-shadow(0 20px 12px rgba(85,38,20,.22)); }
      .continue-section, .progress-panel { margin-top:24px; padding:26px 30px; border:1px solid var(--line); border-radius:20px; background:var(--surface); box-shadow:var(--shadow); }
      .continue-section { display:flex; justify-content:space-between; align-items:center; gap:20px; }
      .continue-section h2 { margin:6px 0; font-size:1.75rem; }
      .continue-section p, .page-heading p { color:var(--muted); margin-bottom:0; }
      .progress-panel > div:first-child { display:flex; justify-content:space-between; gap:16px; margin-bottom:13px; }
      .progress-track, .audio-progress { height:10px; overflow:hidden; background:#f0e7d8; border-radius:99px; }
      .progress-track span, .audio-progress span { display:block; height:100%; background:linear-gradient(90deg,var(--saffron),var(--gold)); border-radius:inherit; transition:width .3s; }
      .page-heading { display:flex; justify-content:space-between; align-items:start; margin-bottom:24px; }
      .page-heading h1 { margin:8px 0; font-size:2.4rem; }
      .theme-button, .reader-favorite, .icon-button { border:0; background:transparent; color:var(--saffron); min-width:48px; min-height:48px; font-size:1.6rem; }
      .story-tools { display:flex; gap:16px; align-items:center; margin-bottom:28px; }
      .collection-tabs { display:flex; gap:8px; margin-bottom:18px; overflow:auto; padding-bottom:4px; }
      .search-box { display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:0 14px; min-height:48px; flex:0 1 300px; }
      .search-box input { border:0; outline:0; background:transparent; color:var(--ink); width:100%; }
      .filter-row { display:flex; gap:8px; overflow:auto; padding-bottom:4px; }
      .filter-button, .speed-button, .font-button, .theme-option { white-space:nowrap; border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:99px; min-height:42px; padding:8px 14px; }
      .filter-button.active, .speed-button.active, .theme-option.active { background:var(--teal); border-color:var(--teal); color:#fff; }
      .story-card { padding:25px; border:1px solid var(--line); border-radius:22px; background:var(--surface); box-shadow:var(--shadow); display:flex; flex-direction:column; transition:transform .2s, box-shadow .2s; }
      .story-card:hover { transform:translateY(-4px); box-shadow:0 22px 42px rgba(101,65,37,.16); }
      .story-card-icon { font-size:4rem; min-height:80px; display:flex; align-items:center; }
      .story-category { display:inline-block; color:var(--teal); font-size:.82rem; font-weight:700; margin:6px 0 12px; }
      .story-card h2 { font-size:1.45rem; margin-bottom:12px; }
      .story-meta { color:var(--muted); margin-bottom:8px; }
      .complete-badge { color:var(--teal); font-size:.85rem; font-weight:700; margin-bottom:12px; }
      .story-card-actions { margin-top:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
      .story-card-actions .button { flex:1; padding-inline:10px; }
      .row { display:grid; grid-template-columns:1fr; gap:18px; }
      .empty-state { padding:50px; text-align:center; color:var(--muted); }
      .reader-page { min-height:100dvh; padding:18px 0 70px; background:var(--paper); }
      .reader-top { width:min(900px, calc(100% - 32px)); margin:0 auto 24px; display:flex; justify-content:space-between; align-items:center; }
      .back-button { border:0; background:transparent; color:var(--ink); font-weight:700; min-height:48px; }
      .story-count { color:var(--muted); font-weight:700; }
      .reader-header { text-align:center; padding:24px 0 30px; }
      .reader-icon { font-size:5rem; filter:drop-shadow(0 12px 10px rgba(101,65,37,.15)); }
      .reader-header h1 { font-size:clamp(2rem, 5vw, 3.8rem); margin:8px 0 14px; }
      .reader-header .story-category { background:#e3f2ed; padding:7px 14px; border-radius:99px; }
      .reader-header p { color:var(--muted); margin-top:15px; }
      .audio-panel { padding:25px; background:var(--surface); border:1px solid var(--line); border-radius:24px; box-shadow:var(--shadow); }
      .audio-heading, .audio-times, .audio-options, .reader-controls { display:flex; align-items:center; justify-content:space-between; gap:16px; }
      .audio-heading h2 { margin:5px 0 18px; font-size:1.35rem; }
      .voice-label { color:var(--teal); font-size:.85rem; font-weight:700; }
      .voice-warning { padding:10px 12px; margin-bottom:14px; border-radius:10px; color:#8c5421; background:#fff1cc; font-size:.9rem; }
      .audio-times { color:var(--muted); font-size:.8rem; margin:7px 0 16px; }
      .audio-main-controls { display:flex; justify-content:center; align-items:center; gap:15px; margin:18px 0; }
      .round-control, .play-control { border:0; border-radius:50%; min-width:48px; min-height:48px; color:var(--ink); background:#eaf1ee; font-size:1.05rem; }
      .play-control { min-width:70px; min-height:70px; background:var(--saffron); color:#fff; font-size:1.7rem; box-shadow:0 8px 16px rgba(217,93,57,.25); }
      .audio-options { flex-wrap:wrap; color:var(--muted); }
      .audio-options input { accent-color:var(--saffron); }
      .speed-options { display:flex; gap:7px; flex-wrap:wrap; }
      .speed-button { min-height:36px; padding:5px 10px; font-size:.8rem; }
      .reader-controls { padding:20px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
      .toggle-control { display:flex; gap:9px; align-items:center; font-weight:700; }
      .toggle-control input { width:20px; height:20px; accent-color:var(--teal); }
      .font-controls, .theme-controls { display:flex; align-items:center; gap:6px; color:var(--muted); }
      .font-button, .theme-option { min-height:38px; padding:5px 10px; }
      .story-text { max-width:800px; margin:30px auto; }
      .story-text p { margin:0 0 22px; color:var(--ink); transition:background .25s, padding .25s; }
      .reader-small p { font-size:1.08rem; line-height:1.85; }
      .reader-medium p { font-size:1.25rem; line-height:1.9; }
      .reader-large p { font-size:1.45rem; line-height:1.9; }
      .active-story-paragraph { background:#fff0bb; border-left:5px solid var(--gold); padding:14px 18px; border-radius:12px; }
      .story-sentence { display:inline; border-radius:8px; transition:background .2s, padding .2s; }
      .active-story-sentence { background:#fff0bb; padding:4px 8px; box-decoration-break:clone; -webkit-box-decoration-break:clone; }
      .bi-play-fill::before { content:'▶'; }
      .bi-pause-fill::before { content:'⏸'; }
      .bi-stop-fill::before { content:'■'; }
      .bi-arrow-repeat::before { content:'↻'; }
      .bi-skip-backward-fill::before { content:'⏮'; }
      .bi-skip-forward-fill::before { content:'⏭'; }
      .insight-card { display:flex; gap:16px; max-width:800px; margin:18px auto; padding:22px; border-radius:18px; border:1px solid var(--line); }
      .insight-card > span { font-size:2rem; }
      .insight-card p { margin:7px 0 0; font-size:1.1rem; line-height:1.7; }
      .moral-card { background:#fff4d7; color:#65471e; }
      .lesson-card { background:#e3f2ed; color:#165b58; }
      .completion-card { text-align:center; max-width:800px; margin:28px auto; padding:30px; border-radius:22px; background:linear-gradient(135deg,#147d78,#225d67); color:#fff; }
      .completion-card > span { font-size:3rem; }
      .completion-card h2 { margin:8px 0; font-size:2rem; }
      .story-navigation { display:flex; gap:14px; max-width:800px; margin:35px auto 0; }
      .story-navigation .button { flex:1; }
      .bottom-nav { position:fixed; left:0; right:0; bottom:0; z-index:50; padding:6px max(8px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(8px, env(safe-area-inset-left)); background:var(--surface); border-top:1px solid var(--line); box-shadow:0 -8px 24px rgba(42,35,25,.08); }
      .bottom-nav-inner { width:min(520px, 100%); margin:auto; display:grid; grid-template-columns:repeat(4, 1fr); }
      .nav-button { min-height:68px; color:var(--ink); border:0; background:transparent; font-size:.8rem; }
      .nav-button div:first-child { font-size:1.25rem; margin-bottom:2px; }
      .nav-button.active { color:var(--saffron); font-weight:800; }
      .nav-button.active div:first-child { transform:translateY(-2px); }
      .install-banner { position:fixed; z-index:100; left:12px; right:12px; bottom:calc(76px + env(safe-area-inset-bottom)); display:flex; align-items:flex-start; gap:12px; padding:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom)); border:1px solid var(--line); border-radius:18px; background:var(--surface); color:var(--ink); box-shadow:0 18px 45px rgba(0,0,0,.2); transform:translateY(calc(120% + env(safe-area-inset-bottom))); opacity:0; transition:transform .22s ease, opacity .22s ease; }
      .install-banner.is-visible { transform:translateY(0); opacity:1; }
      .install-banner-icon { font-size:2rem; line-height:1; }
      .install-banner-copy { flex:1; min-width:0; }
      .install-banner h2 { margin:0 0 4px; font-size:1.1rem; }
      .install-banner p { margin:0; color:var(--muted); font-size:.88rem; line-height:1.45; }
      .install-banner details { margin-top:8px; color:var(--muted); font-size:.84rem; }
      .install-banner ol { margin:7px 0 0; padding-left:20px; line-height:1.7; }
      .install-actions { display:flex; gap:8px; margin-top:12px; align-items:center; }
      .install-button, .install-later, .install-close { min-height:44px; border-radius:10px; font-weight:700; }
      .install-button { border:0; padding:8px 14px; background:var(--saffron); color:#fff; }
      .install-later { border:1px solid var(--line); padding:8px 14px; background:transparent; color:var(--ink); }
      .install-close { border:0; padding:0 10px; background:transparent; color:var(--muted); font-size:1.5rem; line-height:1; }
      @media (min-width:701px) { .install-banner { left:auto; width:min(390px, calc(100% - 24px)); } .row { grid-template-columns:repeat(3, minmax(0, 1fr)); gap:24px; } }
      .home-greeting, .home-categories { margin-bottom:18px; }
      .home-greeting h2 { margin:4px 0; font-size:1.55rem; }
      .home-greeting p { color:var(--muted); margin:0; }
      .home-category-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; }
      .home-category { min-height:68px; padding:12px; text-align:left; border:1px solid var(--line); border-radius:16px; background:var(--surface); color:var(--ink); font-weight:700; box-shadow:0 8px 18px rgba(101,65,37,.06); }
      .home-category span { display:block; color:var(--teal); font-size:.75rem; margin-top:3px; }
      @media (max-width:700px) { .page-shell, .reader-content { width:min(100% - 24px, 520px); } .hero { min-height:0; padding:30px 20px; border-radius:22px; } .hero-emblem { font-size:5rem; align-self:flex-start; } .hero-stats { display:block; } .hero-stats span { display:block; border:0; margin:6px 0; } .continue-section, .story-tools { display:block; } .continue-section .button { margin-top:18px; width:100%; } .search-box { margin-bottom:14px; max-width:none; } .page-heading h1 { font-size:2rem; } .audio-panel { position:sticky; top:72px; z-index:20; padding:18px; } .reader-controls { align-items:flex-start; } .story-navigation { flex-direction:column; } .reader-medium p { font-size:1.18rem; } }
    </style>
  </head>

  <body>
    <header class="app-header">
      <div class="app-header-inner">
        <button type="button" onclick="showPage('home')" class="header-action" aria-label="मुख्यपृष्ठ उघडा">☰</button>
        <button type="button" onclick="showPage('home')" class="app-header-title" aria-label="मराठी गोष्टी मुख्यपृष्ठ">🚩 <span>मराठी गोष्टी<small>शिका · वाचा · ऐका</small></span></button>
        <button type="button" onclick="showPage('stories')" class="header-action" aria-label="कथा निवडा">🔊</button>
      </div>
    </header>
    <div id="app"></div>

    <nav class="bottom-nav">
      <div class="bottom-nav-inner">
        <button type="button" onclick="showPage('home')" class="nav-button">
          <div>🏠</div>
          <div>मुख्यपृष्ठ</div>
        </button>

        <button type="button" onclick="showPage('stories')" class="nav-button">
          <div>📚</div>
          <div>गोष्टी</div>
        </button>

        <button type="button" onclick="showPage('saved')" class="nav-button">
          <div>🔖</div>
          <div>जतन केले</div>
        </button>

        <button type="button" onclick="toggleTheme()" class="nav-button">
          <div>⚙️</div>
          <div>अधिक</div>
        </button>
      </div>
    </nav>

    <script src="./js/pwa-install.js?v=11" defer></script>
    <script src="./js/audio/speechEngine.js?v=11" defer></script>
    <script src="./js/app.js?v=11" defer></script>
  </body>
</html>
